# Surcouche PostgreSQL — à combiner avec compose.yaml :
#
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# ⚠️  EN L'ÉTAT, tout-pris-back NE FONCTIONNE PAS AVEC POSTGRESQL.
#     Le code est SQLite-only (app/database.py) ; trois changements sont
#     nécessaires côté backend avant que cette surcouche serve à quelque chose :
#
#     1. Ajouter le pilote aux dépendances : `psycopg[binary]>=3.2`.
#     2. `create_engine(DATABASE_URL, connect_args={"check_same_thread": False})`
#        — `check_same_thread` est un argument propre à sqlite3 : psycopg
#        lève une TypeError. Le conditionner au schéma de l'URL.
#     3. Le listener `enable_sqlite_wal_mode` exécute `PRAGMA journal_mode=WAL`
#        à chaque connexion : erreur de syntaxe sur PostgreSQL. Même correctif.
#
#     Les modèles et la migration 0001 sont eux déjà portables (Integer, String,
#     index nommé) : rien à reprendre de ce côté.
#
# Une fois ces changements faits, cette surcouche est prête à l'emploi. Elle
# bascule aussi le service `backup` en mode pg_dump.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tout_pris}
      POSTGRES_USER: ${POSTGRES_USER:-tout_pris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      # Les données vivent dans un sous-dossier : un volume monté sur
      # /var/lib/postgresql/data directement pose problème avec le lost+found
      # de certains systèmes de fichiers.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Pas de `ports:` — la base n'est joignable que depuis le réseau interne.
    networks: [toutpris]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tout_pris}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tout_pris}
    depends_on:
      db:
        condition: service_healthy

  backup:
    environment:
      BACKUP_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tout_pris}
      POSTGRES_USER: ${POSTGRES_USER:-tout_pris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
