# Reverse proxy Tout Pris, pour le nginx de l'hôte.
#
#   sudo cp nginx/tout-pris.conf /etc/nginx/sites-available/tout-pris
#   sudo ln -s /etc/nginx/sites-available/tout-pris /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS : sudo certbot --nginx -d tout-pris.example.com ajoute lui-même le
# bloc 443 et la redirection depuis le port 80.

server {
    listen 80;
    server_name tout-pris.example.com;

    client_max_body_size 10m;

    # Le SPA appelle /api/<chemin> et FastAPI expose <chemin> à sa racine : le
    # slash final du proxy_pass retire le préfixe. Même origine, donc pas de CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Sans ça, /api sans slash partirait vers le front.
    location = /api {
        return 308 /api/;
    }

    # Le conteneur front embarque son propre nginx : fallback SPA vers
    # index.html et cache des assets sont gérés là-bas.
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
