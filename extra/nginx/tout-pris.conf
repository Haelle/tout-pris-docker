# Reverse proxy Tout Pris, pour le nginx de l'hôte.
#
#   sudo cp extra/nginx/tout-pris.conf /etc/nginx/sites-available/tout-pris
#   sudo ln -s /etc/nginx/sites-available/tout-pris /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS : sudo certbot --nginx -d tout-pris.example.com ajoute lui-même le
# bloc 443 et la redirection depuis le port 80.

# Les deux conteneurs, publiés sur la loopback par docker-compose.yaml. Les
# ports sont ici et nulle part ailleurs dans ce fichier : ce sont ceux du
# compose, pas ceux exposés à l'intérieur des conteneurs (8000 et 80).
upstream tout_pris_api {
    server 127.0.0.1:8100;
}

upstream tout_pris_front {
    server 127.0.0.1:8180;
}

server {
    listen 80;
    server_name tout-pris.example.com;

    client_max_body_size 10m;

    # nginx n'hérite les proxy_set_header du niveau parent que si le bloc
    # enfant n'en déclare aucun : les quatre ci-dessous valent donc pour tous
    # les location du vhost, mais il suffirait d'en ajouter un seul dans l'un
    # d'eux pour qu'il les perde tous et doive les répéter en entier.
    proxy_http_version 1.1;
    # $host retire le port. C'est ce qu'il faut sur 80/443 : le middleware CSRF
    # compare l'en-tête Origin envoyé par le navigateur à scheme://get_host(),
    # et le navigateur omet lui aussi le port quand il est standard. Servir ce
    # vhost sur un port non standard casserait cette égalité et referait échouer
    # tous les POST en 403 — il faudrait alors $http_host, qui conserve le port.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Vital côté Django, et pas seulement informatif : gunicorn traduit cet
    # en-tête en wsgi.url_scheme, dont Django déduit request.is_secure(). Sans
    # lui l'application se croit en clair derrière le TLS et, SECURE_SSL_REDIRECT
    # étant actif hors DEBUG, renvoie une 301 vers https à chaque requête — donc
    # une boucle de redirection. Il commande aussi les cookies Secure de session
    # et de CSRF, et la vérification de l'en-tête Origin par le middleware CSRF.
    # Encore faut-il que gunicorn accepte de le lire : voir FORWARDED_ALLOW_IPS
    # dans docker-compose.yaml.
    proxy_set_header X-Forwarded-Proto $scheme;

    # 60 s plutôt que les 30 s par défaut : l'envoi des e-mails transactionnels
    # (vérification d'adresse, réinitialisation de mot de passe) appelle l'API
    # Brevo de façon synchrone, et les callbacks OAuth de /accounts/ échangent
    # leur code contre un jeton chez le fournisseur avant de répondre.
    proxy_read_timeout 60s;

    # --- API Django ---------------------------------------------------------
    #
    # Django monte lui-même ses routes sous /api/, /admin/, /accounts/ et
    # /static/ (voir tout_pris/urls.py). Le chemin est donc transmis tel quel :
    # les proxy_pass ci-dessous n'ont volontairement pas de slash final, qui
    # retirerait le préfixe. C'est le changement apporté par le passage à
    # Django — FastAPI exposait ses routes à la racine et le préfixe /api était
    # ajouté puis retiré par ce fichier.

    # L'API elle-même : /api/health/, /api/households/…, l'authentification
    # headless d'allauth sous /api/auth/, le schéma OpenAPI sous /api/schema/
    # et sa documentation sous /api/docs/.
    location /api/ {
        proxy_pass http://tout_pris_api;
    }

    # L'admin Django, exposé publiquement et protégé par le seul mot de passe du
    # superutilisateur. Le restreindre davantage — allow/deny par IP,
    # authentification supplémentaire — se fait dans ce bloc.
    location /admin/ {
        proxy_pass http://tout_pris_api;
    }

    # Callbacks OAuth des fournisseurs externes (Google). Aucune page n'y est
    # rendue, mais le fournisseur y redirige le navigateur : sans ce bloc, le
    # retour de connexion tomberait sur le SPA.
    location /accounts/ {
        proxy_pass http://tout_pris_api;
    }

    # Fichiers statiques de Django — CSS et JS de l'admin et de l'API navigable
    # de DRF — servis par WhiteNoise depuis le processus applicatif, où
    # collectstatic les a figés au build de l'image. Rien à servir depuis le
    # disque de l'hôte, et rien à mettre en cache ici : WhiteNoise pose lui-même
    # un Cache-Control immutable sur ces noms de fichiers hachés. Sans ce bloc,
    # l'admin s'affiche sans style. (/api/docs/ n'en dépend pas : drf-spectacular
    # charge Swagger UI depuis un CDN.)
    location /static/ {
        proxy_pass http://tout_pris_api;
    }

    # Sans ça, ces deux chemins sans slash final partiraient vers le front.
    # Django les redirigerait bien lui-même via APPEND_SLASH, encore
    # faudrait-il qu'ils lui parviennent.
    location = /api {
        return 308 /api/;
    }

    location = /admin {
        return 308 /admin/;
    }

    # --- Front SPA ----------------------------------------------------------

    # Le conteneur front embarque son propre nginx : fallback SPA vers
    # index.html et cache des assets sont gérés là-bas.
    location / {
        proxy_pass http://tout_pris_front;
    }
}
