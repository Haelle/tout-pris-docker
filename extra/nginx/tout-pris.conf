# Reverse proxy Tout Pris, pour le nginx de l'hôte.
#
# HTTPS : sudo certbot --nginx -d tout-pris.example.com ajoute lui-même le
upstream tout_pris_api {
    server 127.0.0.1:8100;
}

upstream tout_pris_front {
    server 127.0.0.1:8180;
}

server {
    listen 80;
    server_name tout-pris.example.com;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Backend API Django
    location /api/ {
        proxy_pass http://tout_pris_api;
    }

    # L'admin Django, exposé publiquement et protégé par le seul mot de passe du superutilisateur.
    # TODO: Le restreindre davantage — allow/deny par IP
    location /admin/ {
        proxy_pass http://tout_pris_api;
    }

    # Callbacks OAuth des fournisseurs externes (Google). Aucune page n'y est
    # rendue, mais le fournisseur y redirige le navigateur : sans ce bloc, le
    # retour de connexion tomberait sur le SPA.
    location /accounts/ {
        proxy_pass http://tout_pris_api;
    }

    # Fichiers statiques de Django
    location /static/ {
        proxy_pass http://tout_pris_api;
    }

    # Sans ça, ces deux chemins sans slash final partiraient vers le front.
    location = /api {
        return 308 /api/;
    }

    location = /admin {
        return 308 /admin/;
    }

    # Front Svelte
    location / {
        proxy_pass http://tout_pris_front;
    }
}
