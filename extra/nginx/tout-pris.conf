# Reverse proxy Tout Pris, pour le nginx de l'hôte.
#
# HTTPS : sudo certbot --nginx -d tout-pris.example.com ajoute lui-même le
upstream tout_pris_api {
    server 127.0.0.1:8100;
}

upstream tout_pris_front {
    server 127.0.0.1:8180;
}

server {
    listen 80;
    server_name tout-pris.example.com;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Backend API Django
    #
    # gzip est ici et pas au niveau du vhost : Django est le seul à renvoyer du
    # JSON brut. Ses trois compagnons ne sont pas décoratifs — le gzip_types par
    # défaut ne couvre que text/html, gzip_proxied interdit par défaut de
    # compresser une réponse d'upstream, gzip_min_length évite de compresser ce
    # qui ne gagne rien. Compresser affaiblit les ETag ("abc" devient W/"abc") :
    # voir « Compression des réponses de l'API » dans le README pour la version
    # d'API que ce bloc exige.
    location /api/ {
        proxy_pass http://tout_pris_api;

        gzip on;
        gzip_types application/json;
        gzip_proxied any;
        gzip_min_length 1024;
    }

    # L'admin Django, exposé publiquement et protégé par le seul mot de passe du superutilisateur.
    # TODO: Le restreindre davantage — allow/deny par IP
    location /admin/ {
        proxy_pass http://tout_pris_api;
    }

    # Callbacks OAuth des fournisseurs externes (Google). Aucune page n'y est
    # rendue, mais le fournisseur y redirige le navigateur : sans ce bloc, le
    # retour de connexion tomberait sur le SPA.
    location /accounts/ {
        proxy_pass http://tout_pris_api;
    }

    # Fichiers statiques de Django
    location /static/ {
        proxy_pass http://tout_pris_api;
    }

    # Sans ça, ces deux chemins sans slash final partiraient vers le front.
    location = /api {
        return 308 /api/;
    }

    location = /admin {
        return 308 /admin/;
    }

    # Front Svelte
    location / {
        proxy_pass http://tout_pris_front;
    }
}
