# Configuration globale du reverse proxy d'entrée.
# Les vhosts vivent dans conf.d/ (montés depuis ./nginx/conf.d).

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # rt/uct/urt : temps de réponse total, connexion upstream, réponse upstream.
    # Indispensable pour distinguer « le proxy rame » de « l'API rame ».
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Par défaut nginx refuse les corps de requête > 1 Mo.
    client_max_body_size 10m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff2;

    # Garde-fou anti-abus sur l'API. `burst` absorbe les rafales légitimes
    # (le SPA enchaîne plusieurs appels au chargement d'une page).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Résolveur DNS interne de Docker. Combiné aux `set $upstream …` des
    # vhosts, il force nginx à re-résoudre les noms de services : sans ça,
    # une IP est figée au démarrage et un `docker compose up -d api` laisse
    # le proxy en 502 jusqu'au rechargement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
