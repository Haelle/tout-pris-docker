# Vhost HTTP de la stack Tout Pris.
#
# Le front et l'API sont servis depuis la même origine : le SPA appelle
# /api/<chemin> et FastAPI expose <chemin> à sa racine. C'est ce proxy qui
# retire le préfixe /api — donc pas de CORS, pas d'URL absolue dans le front.
#
# Pour passer en HTTPS : voir tout-pris-tls.conf.example dans ce dossier.

server {
    # Pas de `listen [::]:80` : le conteneur n'a pas forcément de pile IPv6
    # (nginx refuserait alors de démarrer), et la publication de port Docker
    # relaie déjà les clients IPv6 de l'hôte vers cette socket IPv4.
    listen      80 default_server;
    server_name _;

    # En-têtes de sécurité. À compléter par une CSP quand le contenu du front
    # est stabilisé (elle casse silencieusement les pages si elle est trop
    # stricte, mieux vaut la poser en connaissance de cause).
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header X-Frame-Options        "SAMEORIGIN"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Santé du proxy lui-même (load balancer amont, supervision).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Challenge HTTP-01 de Let's Encrypt (volume certbot_webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # --- API -----------------------------------------------------------------
    # /api/stufflists  ->  http://api:8000/stufflists
    # La capture $1 retire le préfixe ; $is_args$args conserve la query string.
    location ~ ^/api/(.*)$ {
        limit_req zone=api burst=40 nodelay;

        set        $api_upstream api:8000;
        proxy_pass http://$api_upstream/$1$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Attention : un `add_header` dans un bloc `location` remplace ceux
        # hérités du `server`, il faut donc les répéter ici.
        add_header X-Content-Type-Options "nosniff"  always;
        add_header Cache-Control          "no-store" always;
    }

    # Sans ça, /api tout court ne matche pas la regex ci-dessus.
    location = /api {
        return 308 /api/;
    }

    # Décommentez pour ne pas exposer la doc interactive en production.
    # location ~ ^/api/(docs|redoc|openapi\.json)$ {
    #     return 404;
    # }

    # --- Front (SPA) ---------------------------------------------------------
    # L'image tout-pris-front embarque son propre nginx : c'est lui qui gère le
    # fallback SPA vers index.html et le cache long des assets fingerprintés.
    location / {
        set        $front_upstream front:80;
        proxy_pass http://$front_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
