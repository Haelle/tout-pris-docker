# Stack Tout Pris : les deux conteneurs applicatifs, rien d'autre.
# Le reverse proxy est le nginx de l'hôte (nginx/) et les sauvegardes sont
# lancées par systemd (backup/). Voir le README.

name: tout-pris

services:
  api:
    image: estb/tout-pris-back:latest
    restart: unless-stopped
    # Publié sur la loopback : seul le nginx de l'hôte doit y accéder.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/tout_pris.db
    # Bind mount plutôt qu'un volume nommé : les scripts de sauvegarde de
    # l'hôte lisent le fichier directement. Le dossier doit appartenir à
    # 999:999, l'utilisateur non-root de l'image (voir README).
    volumes:
      - ./data:/data
    # --root-path : FastAPI est monté derrière /api par le proxy, ce qui rend
    # /api/docs correct. --proxy-headers : uvicorn lit les X-Forwarded-*.
    command:
      ["uvicorn", "app.main:app", "--host=0.0.0.0", "--port=8000",
       "--root-path=/api", "--proxy-headers", "--forwarded-allow-ips=*"]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  front:
    image: estb/tout-pris-front:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Mises à jour automatiques des deux images ci-dessus, seules à porter le
  # label watchtower.enable. Décommenter pour activer : le socket Docker donne
  # alors au conteneur un accès équivalent à root sur l'hôte.
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_LABEL_ENABLE: "true"
  #     WATCHTOWER_SCHEDULE: "0 0 4 * * *"
  #     WATCHTOWER_CLEANUP: "true"
  #     TZ: Europe/Paris
